<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="KidsModa — Curated kids fashion from Lebanon. Bold colors, playful designs, free worldwide delivery above $50." />
    <meta name="theme-color" content="#FF3ECB" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Open Graph / social -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="KidsModa — Style for Little Icons" />
    <meta property="og:description" content="Curated kids fashion from Lebanon. Bold colors, playful designs, free delivery over $50." />
    <meta property="og:site_name" content="KidsModa" />

    <!-- Preconnect + async-load Google Fonts so they don't block first paint -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;700;800;900&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;700;800;900&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;700;800;900&display=swap" /></noscript>

    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👗</text></svg>" />
    <title>KidsModa — Style for Little Icons</title>
    <style>
      /* Minimal critical CSS so the first paint doesn't flash unstyled */
      html, body { margin: 0; padding: 0; background: #FFF8F0; color: #111; font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
      #root:empty::before { content: ''; display: block; height: 100vh; }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
